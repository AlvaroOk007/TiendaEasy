<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy: Seleccionado para vos</title>
    <link rel="stylesheet" href="src/styles/styles.css">
    <link rel="shortcut icon" href="src/imgs/logos&icons/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header>
        <div class="conteiner-logo">
            <a href="index.html">
                <img src="src/imgs/logos&icons/logo.svg" alt="Logo de Easy">
            </a>
        </div>
        <div class="buscador">
            <input type="text" placeholder="¡Hola! ¿Qué estás buscando?" id="content-buscador">
            <button class="btn-buscador" id="btn-buscar"><span class="material-symbols-outlined">
                search
            </span></button>
        </div>
        <nav class="navbar-principal">
            <div class="icon-hamburguesa">
            </div>
            <ul>
                <li><a href="#">Locales</a></li>
                <li><a href="#">Mundo Experto</a></li>
                <li><a href="#">Venta Empresas</a></li>
                <li><a href="#">Contactenos</a></li>
                <li class="conteiner-trolley">
                    <a href="#" class="content-trolley">
                        <span class="counter" id="counter-trolley"></span>
                        <span class="material-symbols-outlined" id="icon-trolley">
                            shopping_cart
                        </span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="conteiner-principal">
        <article class="conteiner-off-day" id="off-day">

        </article>
        <h2 class="title">Ofertas imperdibles</h2>
        <article class="conteiner-off-imperdible" id="off-imperdible">           
            <div class="conteiner-1">
                <div class="ofi-1">
                    <img src="src/imgs/off-imperdible/1ofi.webp" alt="" class="off-imperdible_img-little">
                </div>
                <div class="ofi-2">
                    <img src="src/imgs/off-imperdible/2ofi.webp" alt=""class="off-imperdible_img-little">
                </div>
            </div>
            <div class="ofi-3">
                <img src="src/imgs/off-imperdible/3ofi.webp" alt=""class="off-imperdible_img-big">
            </div>
            <div class="conteiner-2">
                <div class="ofi-4">
                    <img src="src/imgs/off-imperdible/4ofi.webp" alt=""class="off-imperdible_img-little">
                </div>
                <div class="ofi-5">
                    <img src="src/imgs/off-imperdible/5ofi.webp" alt=""class="off-imperdible_img-little">
                </div>
            </div>
        </article>
        <h2 class="title">Categorias imperdibles</h2>
        <section class="conteiner-categorias-destacadas" id="categorias-destacadas">
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c1.webp" alt="" class="img-categoria">
                <h2>Muebles de interior</h2>
            </article>
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c2.webp" alt="" class="img-categoria">
                <h2>Electro</h2>
            </article>
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c3.webp" alt="" class="img-categoria">
                <h2>Herramientas</h2>
            </article>
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c4.webp" alt="" class="img-categoria">
                <h2>Baños y Cocinas</h2>
            </article>
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c5.webp" alt="" class="img-categoria">
                <h2>Construcción</h2>
            </article>
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c7.webp" alt="" class="img-categoria">
                <h2>Pisos</h2>
            </article>
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c8.webp" alt="" class="img-categoria">
                <h2>Jardín y Aire Libre</h2>
            </article>
            <article class="conteiner-categoria">
                <img src="src/imgs/categorias/c9.webp" alt="" class="img-categoria">
                <h2>Aberturas</h2>
            </article>
        </section>
        <h2 class="title">Productos recomendados</h2>
        <section class="conteiner-productos-recomendados" id="productos-recomendados">
            
        </section>
        <div class="contendor-btn-mas">
            <button id="btn-agregarmas">Mas</button>
        </div>
    </main>
    <footer><p>Pagina Credad por Álvaro Bravo</p></footer>
</body>
<script src="src/scripts/scripts.js"></script>
</html>
